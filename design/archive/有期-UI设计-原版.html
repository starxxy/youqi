const taskById=id=>state.tasks.find(t=>t.id===id);
function badgeTask(t){const days=overdueDays(t.due),level=overdueLevel(t.due);return `${!t.done&&days?`<span class="badge danger" style="background:${overdueTones[level-1]};color:${level<=2?'#4d2530':'#fff'}">逾期 ${days} 天 · ${level} 级</span>`:`<span class="badge ${t.done?'success':'muted'}">${t.done?'已完成':t.due===TODAY?'今天截止':dateLabel(t.due)+'截止'}</span>`}${t.revision?`<span class="badge muted revision-${revisionHues[t.revision%revisionHues.length]}"><i class="revision-dot"></i>改期 ${t.revision} 次</span>`:''}`}
function header(v,title,sub,action='new-task',icon='plus'){return `<div class="topline"><div><p class="eyebrow">${sub}</p><h2>${title}</h2></div><button class="icon-btn ${icon==='avatar'?'avatar':''}" ${act(action)} aria-label="${action==='new-task'?'新增待办':action==='settings'?'打开设置':'返回'}">${icon==='avatar'?'我':ico(icon)}</button></div>`}
function days(){return `<div class="days">${['一','二','三','四','五','六','日'].map((w,i)=>`<div class="day ${i===6?'today':''}"><span>${w}</span><b>${i+5}</b></div>`).join('')}</div>`}
function taskRow(t,urgent=false){return `<div class="task-row ${urgent?'urgent-task':''} ${t.done?'is-done':''}"><button class="check ${t.done?'done':''}" ${act('complete',`data-id="${esc(t.id)}"`)} aria-label="${t.done?'撤销完成':'完成'}${esc(t.title)}">${t.done?ico('check'):''}</button><button class="task-main" ${act('open-task',`data-id="${esc(t.id)}"`)}><strong>${esc(t.title)}</strong><p>${t.type==='daily'?`${ico('repeat').replace('class="ico ','class="ico tiny ')} 每日重复`:`预计 ${t.estimate} 天`}${urgent||t.revision?badgeTask(t):`<span>${t.due===TODAY?'今天截止':dateLabel(t.due)}</span>`}</p></button><button ${act('open-task',`data-id="${esc(t.id)}"`)} aria-label="查看${esc(t.title)}" style="padding:2px 0">${ico('chevron','chevron')}</button></div>`}
function section(title,right='',action=''){return `<div class="section-title"><h3>${title}</h3>${action?`<button ${act(action)}>${right}</button>`:`<span>${right}</span>`}</div>`}
function todayA(v){const pending=state.tasks.filter(t=>!t.done),late=pending.filter(t=>overdueDays(t.due)),normal=pending.filter(t=>!overdueDays(t.due));return `${header(v,'今天要做什么？','10 月 11 日，星期日','settings','avatar')}${days()}<div class="brief">${ico('sun')}<div><strong>今天，给重要的事留点时间</strong><p>${pending.length} 项待完成，${late.length} 项需要重新安排</p></div></div>${section('需要你关注',`${late.length} 项`)}${late.length?late.map(t=>taskRow(t,true)).join(''):'<p class="empty-state">没有逾期任务，按自己的节奏来。</p>'}${section('今日待办',`${normal.length} 项`)}${normal.map(t=>taskRow(t)).join('')}<button class="add-inline" ${act('new-task')}>${ico('plus')}添加一件事</button>${section('接下来','查看日程','schedule')}<button class="mini-plan full" ${act('schedule')}><time>11:00</time><div><strong>整理本周工作记录</strong><p>留 40 分钟，给这一周一个收尾</p></div>${ico('chevron')}</button>`}
function eventCard(e,current=false){const t=taskById(e.taskId);return `<div class="time-item ${current?'current':''}"><time>${e.start}</time><div class="time-track"><button class="event-card" ${act('edit-event',`data-id="${e.id}"`)}><strong>${esc(t?.title||'自由安排')}</strong><p>${e.start} — ${e.end} ${t?.done?' · 已完成':''}</p><div class="event-meta"><span>${e.reminders.length?ico('bell')+' '+e.reminders.length+' 个提醒':'留一段完整的时间'}</span>${t&&!t.done&&overdueDays(t.due)?`<span style="color:var(--danger)">逾期 ${overdueDays(t.due)} 天</span>`:''}</div></button></div></div>`}
function todayB(v){return `${header(v,'一天，有序展开','星期日 · 2026 年 10 月 11 日','new-task','plus')}${days()}<div class="week-caption"><span>今天的安排</span><span>共 ${state.events.length} 段 · 3 小时</span></div><div class="timeline">${state.events.slice(0,2).map((e,i)=>`${i===0?'<div class="now-line">现在 09:41</div>':''}${eventCard(e,i===0)}`).join('')}<div class="time-item"><time>12:00</time><div class="time-track"><div class="free-time">午间留白 · 休息一下，不必排满</div></div></div>${state.events.slice(2).map(e=>eventCard(e)).join('')}</div><button class="add-inline" ${act('new-task')}>${ico('plus')}安排一段时间</button>`}
function todayC(v){const t=state.tasks.find(t=>!t.done)||state.tasks[0],e=state.events.find(e=>e.taskId===t.id);return `${header(v,'只专注，眼前这一件','10 月 11 日 · 星期日','settings','avatar')}<p class="subtext">不必一次完成所有事。先向前一步。</p><div class="focus-hero"><div class="focus-label"><span><i></i>现在适合做</span><span>${e?e.start+' — '+e.end:'自由安排'}</span></div><h3>${esc(t.title)}</h3><div class="focus-time">${ico('clock')}<span>给自己</span><b>${e?'90':'20'}</b><span>分钟</span></div><div class="chips" style="margin-top:17px">${badgeTask(t)}</div><button class="primary full" ${act('focus',`data-id="${t.id}"`)}>${ico('play')}进入专注</button><div class="focus-bottom"><span>手机响铃 · 电脑仅通知</span><button ${act('open-task',`data-id="${t.id}"`)} style="color:var(--accent);font-size:10px">查看详情</button></div></div>${section('之后，再做这些','查看日程','schedule')}${state.events.filter(x=>x.taskId!==t.id).map(e=>`<button class="queue-row full" ${act('edit-event',`data-id="${e.id}"`)}><time>${e.start}</time><strong>${esc(taskById(e.taskId)?.title)}</strong>${ico('chevron')}</button>`).join('')}<div class="list-header"><span>今天已完成 ${state.tasks.filter(t=>t.done).length} / ${state.tasks.length}</span><span>按自己的节奏</span></div><div class="progress-line"><span style="width:${state.tasks.filter(t=>t.done).length/state.tasks.length*100}%"></span></div>`}
function schedule(v){return `${header(v,'每日时间规划','10 月 11 日 · 星期日')}${days()}<div class="chips"><span class="badge accent">${state.events.length} 个安排</span><span class="badge muted">点按时间段可调整</span></div><div class="timeline">${state.events.map((e,i)=>`${i===0?'<div class="now-line">现在 09:41</div>':''}${eventCard(e,i===0)}`).join('')}</div><button class="add-inline" ${act('new-task')}>${ico('plus')}添加任务与时间安排</button>`}
function nextEventReminder(){
 const candidates=[];
 for(const event of state.events){if(taskById(event.taskId)?.done)continue;for(const reminder of event.reminders){if(reminder.enabled===false)continue;const time=offsetTime(reminder.anchor==='start'?event.start:event.end,reminder.offset);if(/^\d{2}:\d{2}$/.test(time)&&time>'09:41')candidates.push({time,title:taskById(event.taskId)?.title,label:reminderLabel(reminder)});}}
 candidates.sort((a,b)=>a.time.localeCompare(b.time));const next=candidates[0];
 return next?'<strong>下一条事件提醒 · 今天 '+next.time+'</strong><p>'+esc(next.title)+' · '+next.label+'</p>':'<strong>当天暂无待响事件提醒</strong><p>可以为任务添加新的时间安排与提醒</p>';
}
function alarms(v){return `${header(v,'让提醒，准时发生','闹钟中心','new-alarm','plus')}<div class="next-alarm">${ico('alarm')}<div>${nextEventReminder()}</div></div><div class="chips" style="margin-bottom:15px"><button class="badge accent" ${act('shift')}>${ico('repeat')} 循环排班</button><button class="badge muted" ${act('alarm-info')}>响铃与重响设置</button></div>${state.alarms.map(a=>{const taskDone=a.eventId&&taskById(state.events.find(e=>e.id===a.eventId)?.taskId)?.done;const effective=a.enabled&&!taskDone;return `<div class="alarm-card ${effective?'':'alarm-disabled'}"><div class="alarm-top"><button ${act('edit-alarm',`data-id="${a.id}"`)} aria-label="编辑${esc(a.title)}"><span class="alarm-time">${a.time}</span></button><button class="switch ${effective?'on':''}" role="switch" aria-checked="${effective}" aria-label="${esc(a.title)}开关" ${act('toggle-alarm',`data-id="${a.id}"`)}></button></div><p class="alarm-title">${esc(a.title)}</p><p class="alarm-rule">${taskDone?'任务已完成，关联提醒停用':esc(a.rule)}</p><div class="alarm-links"><span>${a.tone} · 贪睡 ${a.snooze} 分钟 / ${a.maxSnoozes} 次</span><button ${act('edit-alarm',`data-id="${a.id}"`)}>自定义</button></div></div>`}).join('')}<button class="secondary full" ${act('new-alarm')}>${ico('plus')}新增闹钟</button><p class="subtext" style="margin-top:12px;font-size:10px">精确闹钟权限与响铃测试将在正式 APP 中提供。</p>`}
function shift(v){const sh=state.shift;return `${header(v,'跟着你的班次走','循环排班','alarms','back')}<div class="setting-card"><div class="setting-row"><span>启用循环排班</span><button class="switch ${sh.enabled?'on':''}" role="switch" aria-checked="${sh.enabled}" aria-label="启用循环排班" ${act('toggle-shift')}></button></div><div class="setting-row"><span>第 1 天从哪天开始</span><input aria-label="排班起始日期" type="date" value="${sh.anchor}" data-shift-anchor></div><div class="setting-row"><span>循环长度</span><button ${act('edit-shift')}>${sh.days.length} 天 ${ico('chevron')}</button></div></div><div class="cycle-days">${sh.days.map((d,i)=>`<button class="cycle-day ${i===0?'active':''}" ${act('edit-shift',`data-day="${i}"`)}><small>第 ${i+1} 天</small><b>${d.times[0]||'休息'}</b><span>${d.times.length>1?d.times.length+' 个闹钟':d.label}</span></button>`).join('')}</div><div class="repeat-flow">${ico('repeat')}第 ${sh.days.length+1} 天回到第 1 天，持续循环</div>${section('排班预览','2026 年 10 月')}<div class="month-grid">${['一','二','三','四','五','六','日'].map(x=>`<div class="weekday">${x}</div>`).join('')}${Array.from({length:3},()=>'<div></div>').join('')}${Array.from({length:18},(_,i)=>{const day=i+1,offset=Math.floor((Date.parse(`2026-10-${String(day).padStart(2,'0')}T00:00:00Z`)-Date.parse(sh.anchor+'T00:00:00Z'))/86400000);const normal=offset>=0?sh.days[offset%sh.days.length]:null,exception=sh.exceptions?.[`2026-10-${String(day).padStart(2,'0')}`],d=exception?{times:exception,label:'临时调整'}:normal;return `<div class="${d?(d.times.length?'scheduled':'rest'):''}">${day}${d?`<small>${((d.times[0]||'休')+(exception?'*':''))+(exception?'*':'')}</small>`:'<small>&nbsp;</small>'}</div>`}).join('')}</div><button class="primary full" ${act('edit-shift')}>${ico('edit')}编辑排班与当天例外</button><p class="subtext" style="margin-top:12px;font-size:10px">每个循环日可添加多个闹钟；临时调整可仅作用于当天。</p>`}
function reminderLabel(r){return `${r.anchor==='start'?'开始':'结束'}${r.offset===0?'时':r.offset<0?'前 '+Math.abs(r.offset)+' 分钟':'后 '+r.offset+' 分钟'}`}
function remindersHtml(e){return e.reminders.length?e.reminders.map(r=>`<div class="reminder-row">${ico('bell')}<div class="reminder-copy"><strong>${reminderLabel(r)}</strong><p>${offsetTime(r.anchor==='start'?e.start:e.end,r.offset)} · ${taskById(e.taskId)?.done?'已完成，提醒停用':'手机响铃'}</p></div><button ${act('remove-reminder',`data-event="${e.id}" data-id="${r.id}"`)} aria-label="删除${reminderLabel(r)}提醒">${ico('close')}</button></div>`).join(''):'<p class="subtext" style="padding:13px 0">暂未设置提醒</p>'}
function taskDetail(v,compact=false){const t=taskById(views[v].taskId)||state.tasks[0],e=state.events.find(e=>e.taskId===t.id);return `${compact?'<p class="eyebrow">任务详情</p>':header(v,'把这件事，做完','任务详情','today','back')}<h3 class="task-title">${esc(t.title)}</h3><div class="chips">${badgeTask(t)}</div><p class="task-description">${esc(t.description)}</p><div class="setting-card"><div class="setting-row"><span>任务类型</span><span>${t.type==='daily'?'每日独立重复':'持续到完成'}</span></div><div class="setting-row"><span>开始日期</span><span>${dateLabel(t.start)}</span></div><div class="setting-row"><span>截止日期</span><button ${act('reschedule',`data-id="${t.id}"`)} style="font-size:11px;color:var(--accent)">${dateLabel(t.due)} ${ico('edit')}</button></div><div class="setting-row"><span>预计需要</span><span>${t.estimate} 天</span></div>${e?`<div class="setting-row"><span>今天安排</span><button ${act('edit-event',`data-id="${e.id}"`)} style="font-size:11px;color:var(--accent)">${e.start} — ${e.end} ${ico('edit')}</button></div>`:''}</div>${section('关联提醒',e?'添加提醒':'','add-reminder')}${e?remindersHtml(e):'<p class="subtext">安排时间后，即可设置相对提醒。</p>'}${t.revision?`${section('改期记录',t.revision+' 次')}<div class="history-row revision-${revisionHues[t.revision%5]}"><b>${dateLabel(t.history.at(-1)?.changedAt)}</b>${dateLabel(t.history.at(-1)?.from)} 改至 ${dateLabel(t.due)}</div>`:''}<div class="button-row"><button class="secondary" ${act('overdue')}>到期处理</button><button class="primary" ${act('complete',`data-id="${t.id}"`)}>${ico('check')}${t.done?'撤销完成':'标记完成'}</button></div>`}
function overdue(v){const t=taskById(views[v].taskId)||state.tasks[0],days=overdueDays(t.due),level=overdueLevel(t.due);return `${header(v,'换个安排，继续前进','到期处理','task','back')}<p class="subtext">保留走过的过程，也允许重新开始。</p><div class="due-summary"><h3>${esc(t.title)}</h3><div class="chips">${badgeTask(t)}</div><p>当前截止日期：${dateLabel(t.due)}</p><div class="level-scale">${Array.from({length:7},(_,i)=>`<span class="${level===i+1?'selected':''}">${i+1}</span>`).join('')}</div><div class="scale-caption"><span>${days?'当前为 '+level+' 级':'当前未逾期'}</span><span>每天加深一级 · 最高 7 级</span></div></div><button class="due-option" ${act('postpone',`data-id="${t.id}"`)}><strong>${ico('clock')}继续延后</strong><p>保留截止日期，逾期天数继续累计。<br>用每天加深的颜色提醒自己。</p></button><button class="due-option emphasis" ${act('reschedule',`data-id="${t.id}"`)}><strong>${ico('calendar')}重新设置截止日期</strong><p>换一个现实可行的日期。改期标识换色，<br>历史保留；新日期到期前不显示逾期。</p></button>${section('已经走过的调整',t.revision+' 次')}${t.history.length?t.history.slice(-2).reverse().map((h,i)=>`<div class="history-row revision-${revisionHues[(t.revision-i)%5]}"><b>${dateLabel(h.changedAt)} · 第 ${t.revision-i} 次改期</b>${dateLabel(h.from)} 改至 ${dateLabel(h.to)}</div>`).join(''):'<p class="subtext">还没有改期记录。</p>'}`}
function appearance(v){return `${header(v,'换一种，喜欢的样子','外观与皮肤','settings','back')}<p class="subtext">布局保持熟悉，颜色跟着心情变化。</p><div class="skin-preview"><h3>给今天一点秩序</h3><div class="fake-row"><i></i>整理本周工作记录 <span class="badge accent" style="margin-left:auto">今天</span></div><div class="fake-row"><i></i>阅读 20 分钟 <span style="margin-left:auto;color:var(--muted)">14:00</span></div></div>${section('显示模式','立即预览')}<div class="skin-swatch-row"><button class="skin-swatch ${state.skins[v]==='light'?'active':''}" ${act('skin','data-skin="light"')}><i></i>浅色 · 清晰明亮</button><button class="skin-swatch dark ${state.skins[v]==='dark'?'active':''}" ${act('skin','data-skin="dark"')}><i></i>深色 · 安静专注</button></div>${section('状态颜色','所有皮肤一致识别')}<p class="subtext">逾期用深浅表达紧迫程度，也显示等级。</p><div class="level-scale">${Array.from({length:7},(_,i)=>`<span>${i+1}</span>`).join('')}</div><div class="scale-caption"><span>轻度逾期</span><span>逾期 7 天及以上</span></div><div class="legend-line revision-violet"><i class="revision-dot"></i>改期用独立标识色，保留累计次数。</div><div class="setting-card"><div class="setting-row"><span>更多主题</span><span>后续可扩展 ${ico('palette')}</span></div><div class="setting-row"><span>颜色以外的状态提示</span><span>文字与等级始终保留</span></div></div>`}
function sync(v){return `${header(v,'每一端，都接得上','同步与设备','settings','back')}<div class="brief">${ico('cloud')}<div><strong>本机数据，随时可用</strong><p>同步服务尚未连接 · 离线优先</p></div></div><div class="sync-route"><div class="sync-node">${ico('phone')}手机</div>${ico('sync')}<div class="sync-node">${ico('cloud')}同步服务</div>${ico('sync')}<div class="sync-node">${ico('desktop')}电脑</div></div>${section('设备提醒策略','独立设置')}<div class="setting-card">${state.devices.map(d=>`<div class="device-item">${ico(d.id==='phone'?'phone':'desktop')}<div class="device-copy"><strong>${d.name}</strong><p>${d.platform}${d.current?' · 当前演示设备':' · 待连接'}</p></div><select class="device-mode" aria-label="${d.name}提醒方式" data-device="${d.id}"><option value="ring" ${d.mode==='ring'?'selected':''}>响铃</option><option value="notify" ${d.mode==='notify'?'selected':''}>仅通知</option><option value="silent" ${d.mode==='silent'?'selected':''}>静默</option></select></div>`).join('')}</div><button class="secondary full" ${act('connect')}>${ico('plus')}连接另一台设备</button><div class="offline-callout">任务、改期记录、时间安排和排班将支持跨端同步。提醒按设备偏好执行；发生冲突时保留双方修改，供你选择。</div><p class="subtext" style="font-size:10px;margin-top:12px">此处为同步流程与设备设置预览，尚未连接实际设备。</p>`}
function settings(v){return `${header(v,'按你的习惯来','设置','today','back')}<div class="setting-card">${[['appearance','palette','外观与皮肤'],['sync','sync','同步与设备'],['shift','repeat','循环排班'],['alarm-info','alarm','响铃与重响设置'],['overdue','flag','逾期与改期规则']].map(([a,i,t])=>`<button class="settings-menu" ${act(a)}>${ico(i)}<span>${t}</span>${ico('chevron')}</button>`).join('')}</div><div class="offline-callout">有期<br>给待办一个期限，给今天一个安排。</div>`}
function renderPage(v){switch(views[v].page){case'today':return v==='a'?todayA(v):v==='b'?todayB(v):todayC(v);case'schedule':return schedule(v);case'alarms':return alarms(v);case'shift':return shift(v);case'task':return taskDetail(v);case'overdue':return overdue(v);case'appearance':return appearance(v);case'sync':return sync(v);case'settings':return settings(v)}}
function nav(v){const p=views[v].page;return `<nav class="bottom-nav" aria-label="主导航">${[['today','list','待办'],['schedule','calendar','日程'],['alarms','alarm','闹钟'],['settings','settings','设置']].map(([a,i,l])=>`<button ${act(a)} class="${a===p||(a==='settings'&&['sync','appearance'].includes(p))||(a==='alarms'&&p==='shift')?'active':''}"><span class="nav-icon">${ico(i)}</span>${l}</button>`).join('')}</nav>`}
function sidebar(v){return `<aside class="desktop-sidebar"><div class="desktop-brand">${ico('logo')}有期</div><div class="side-nav">${[['today','list','今日待办'],['schedule','calendar','时间规划'],['alarms','alarm','闹钟中心'],['shift','repeat','循环排班']].map(([p,i,t])=>`<button class="${views[v].page===p?'active':''}" ${act(p)}>${ico(i)}${t}</button>`).join('')}</div><div class="sidebar-bottom"><div class="side-nav">${[['appearance','palette','外观与皮肤'],['sync','sync','同步与设备']].map(([p,i,t])=>`<button class="${views[v].page===p?'active':''}" ${act(p)}>${ico(i)}${t}</button>`).join('')}</div><p class="connection"><i></i>本机模式 · 同步待连接</p></div></aside>`}
function sheet(v){const s=views[v].sheet;if(!s)return '';const t=taskById(s.id||views[v].taskId);let body='',title='';
 if(s.type==='reschedule'){title='重新设置截止日期';body=`<p class="subtext">${esc(t.title)} · 当前 ${dateLabel(t.due)}</p><label class="field"><span>新的截止日期</span><input name="due" type="date" value="2026-10-15" required></label><div class="revision-preview revision-${revisionHues[(t.revision+1)%5]}"><i class="revision-dot"></i>改期标识换色 · 第 ${t.revision+1} 次改期</div><p class="subtext">设置未来日期后，当前逾期等级归零。此前的截止日期与逾期记录保留。</p>`}
 if(s.type==='new-task'){title='给一件事，留个位置';body=`<label class="field"><span>待办名称</span><input name="title" placeholder="例如：完成下周的工作计划" maxlength="60" required></label><label class="field"><span>任务类型</span><select name="type"><option value="persistent">持续显示，直到完成</option><option value="daily">每日重复，每次独立完成</option></select></label><div class="field-row"><label class="field"><span>开始日期</span><input name="start" type="date" value="${TODAY}" required></label><label class="field"><span>预计天数</span><input name="estimate" type="number" min="1" max="365" value="1" required></label></div><label class="field"><span>截止日期</span><input name="due" type="date" value="${TODAY}" required></label><button type="button" class="badge accent" ${act('calculate-due')}>根据开始日期和预计天数填写</button><div class="field-row"><label class="field"><span>今天开始（可选）</span><input name="eventStart" type="time"></label><label class="field"><span>今天结束（可选）</span><input name="eventEnd" type="time"></label></div>`}
 if(s.type==='edit-event'){const e=state.events.find(e=>e.id===s.id);title='调整这段时间';body=`<p class="time-edit-title">${esc(taskById(e.taskId)?.title)}</p><div class="field-row"><label class="field"><span>开始时间</span><input name="start" type="time" value="${e.start}" required></label><label class="field"><span>结束时间</span><input name="end" type="time" value="${e.end}" required></label></div><div class="reminder-chips">${e.reminders.map(r=>`<span class="reminder-chip">${reminderLabel(r)}</span>`).join('')}</div><p class="subtext">调整时间后，相对提醒自动更新。结束早于开始按跨午夜处理。</p>`}
 if(s.type==='add-reminder'){title='添加一个提醒';body=`<label class="field"><span>相对哪个时间</span><select name="anchor"><option value="start">事件开始</option><option value="end">事件结束</option></select></label><div class="field-row"><label class="field"><span>提醒时机</span><select name="direction"><option value="-1">提前</option><option value="0">准时</option><option value="1">延后</option></select></label><label class="field"><span>分钟</span><input name="minutes" type="number" min="0" max="10080" value="30" required></label></div><p class="subtext">支持跨天提醒。可重复添加多个提醒，分别相对开始或结束时间。</p>`}
 if(s.type==='new-alarm'||s.type==='edit-alarm'){const a=state.alarms.find(a=>a.id===s.id);title=a?'自定义闹钟':'新增闹钟';body=`<label class="field"><span>闹钟名称</span><input name="title" value="${esc(a?.title||'')}" placeholder="例如：起身活动一下" required></label><div class="field-row"><label class="field"><span>响铃时间</span><input name="time" type="time" value="${a?.time||'07:00'}" required></label><label class="field"><span>重复规则</span><select name="kind">${[['once','仅一次'],['daily','每天'],['weekly','工作日'],['interval','每隔若干天'],['window','时段内周期']].map(([k,l])=>`<option value="${k}" ${(a?.kind||'daily')===k?'selected':''}>${l}</option>`).join('')}${a?.kind==='event'?'<option value="event" selected>关联事件提醒</option>':''}</select></label></div><div class="field-row"><label class="field"><span>间隔（周期为分钟 / 隔天为天）</span><input name="interval" type="number" min="1" value="${a?.interval||60}"></label><label class="field"><span>周期结束时间</span><input name="windowEnd" type="time" value="${a?.windowEnd||'18:00'}"></label></div><label class="field"><span>起始日期</span><input name="anchorDate" type="date" value="${a?.anchorDate||TODAY}"></label><div class="field-row"><label class="field"><span>贪睡间隔 / 分钟</span><input name="snooze" type="number" min="1" max="120" value="${a?.snooze||5}"></label><label class="field"><span>最多重响次数</span><input name="maxSnoozes" type="number" min="0" max="50" value="${a?.maxSnoozes??3}"></label></div><div class="field-row"><label class="field"><span>铃声</span><select name="tone">${['晨光','清铃','水滴'].map(t=>`<option ${a?.tone===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field"><span>单次响铃 / 秒</span><input name="duration" type="number" min="5" max="600" value="${a?.duration||60}"></label></div><label class="field"><span>振动</span><select name="vibrate"><option value="yes" ${a?.vibrate!==false?'selected':''}>开启</option><option value="no" ${a?.vibrate===false?'selected':''}>关闭</option></select></label>`}
 if(s.type==='edit-shift'){title='编辑循环排班';body=`<p class="subtext">用逗号分隔同一天的多个闹钟，留空代表休息。</p><label class="field"><span>循环长度 / 天（1—14）</span><input name="length" type="number" min="1" max="14" value="${state.shift.days.length}" data-cycle-length></label><div data-cycle-fields>${state.shift.days.map((d,i)=>`<label class="field"><span>第 ${i+1} 天 · ${d.label}</span><input name="day${i}" value="${d.times.join(', ')}" placeholder="07:00, 12:30"></label>`).join('')}</div><label class="field"><span>修改作用范围</span><select name="scope"><option value="cycle">整个循环规则</option><option value="date">仅指定日期（当天例外）</option></select></label><label class="field"><span>例外日期</span><input name="exceptionDate" type="date" value="${TODAY}"></label><p class="subtext">当天例外只替换该日响铃，不移动后续循环位置。</p>`}
 if(s.type==='focus'){title='现在，只做这一件';body=`<div class="focus-hero" style="margin-top:0"><div class="focus-label"><span>专注预览</span><span>请按自己的节奏</span></div><h3>${esc(t.title)}</h3><div class="focus-time"><b>90:00</b><span>计划专注时间</span></div></div><p class="subtext" style="margin-top:15px">这是专注界面的设计预览。正式 APP 中可启动计时并配合结束提醒。</p>`}
 if(s.type==='alarm-info'){title='每种重复，都有自己的节奏';body=`<div class="setting-card"><div class="setting-row"><span>每天 / 自选星期</span><span>固定作息</span></div><div class="setting-row"><span>每隔 N 天</span><span>从指定日期起计算</span></div><div class="setting-row"><span>时段内周期提醒</span><span>例如每 60 分钟喝水</span></div><div class="setting-row"><span>N 天循环排班</span><span>逐天配置多个闹钟</span></div><div class="setting-row"><span>贪睡 / 未处理重响</span><span>独立间隔与次数</span></div></div><p class="subtext">正式响铃页将区分“停止本次”“稍后再响”“跳过下一次”和“关闭整个闹钟”。锁屏、后台、重启及权限状态需要在原生 APP 真机验证。</p>`}
 if(s.type==='connect'){title='连接你的另一台设备';body=`<div class="sync-route"><div class="sync-node">${ico('phone')}Android</div>${ico('sync')}<div class="sync-node">${ico('desktop')}Windows / macOS</div></div><div class="offline-callout">未来可登录同一账户或通过设备配对连接。同步服务、认证与设备登记接口已在交付文件中预留。</div><p class="subtext" style="margin-top:15px">当前原型仅保存本机示例数据；没有发起实际配对或上传。</p>`}
 const informational=['alarm-info','connect','focus'].includes(s.type);
 return `<div class="sheet-overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-handle"></div><div class="sheet-header"><h3>${title}</h3><button type="button" class="icon-btn small" ${act('close-sheet')} aria-label="关闭">${ico('close')}</button></div><form data-form="${s.type}">${body}<p class="sheet-error" role="alert"></p><button class="primary full" type="${informational?'button':'submit'}" ${informational?act('close-sheet'):''} style="margin-top:20px">${informational?'知道了':'保存设置'}</button></form></section></div>`;
}
function device(v){return `<div class="device ${mode==='desktop'?'desktop':''}" data-variant="${v}" data-skin="${state.skins[v]}"><div class="camera"></div><div class="statusbar"><span>9:41</span><span class="status-signals">${ico('signal')}${ico('wifi')}${ico('battery')}</span></div>${mode==='desktop'?`<div class="windowbar"><div class="window-controls"><i></i><i></i><i></i></div><span>有期 · ${variants[v].name}</span><span>本机模式</span></div>`:''}<div class="app-shell">${mode==='desktop'?sidebar(v):''}<main class="mobile-main">${renderPage(v)}</main>${mode==='desktop'?`<aside class="desktop-detail">${taskDetail(v,true)}</aside>`:nav(v)}${sheet(v)}</div></div>`}
function render(){document.body.className=`${capture?'capture-view ':''}${single?'single-view':''}`;const page=views[selected].page;document.querySelector('#app').innerHTML=`<header class="review-head"><div class="brand"><div class="brandmark">${ico('logo')}</div><div><h1>有期 <span style="font-weight:400;color:#8390a3;font-size:16px;margin-left:7px">待办与闹钟</span></h1><p>第一轮 UI 设计 · 三种布局，同一个有序的今天</p></div></div><div class="review-meta"><strong>先选布局，再做 APP</strong><br>Android 优先 · Windows / macOS 扩展 · 预留跨端同步</div></header><div class="review-tools"><div class="tool-group"><span class="tool-caption">预览</span><div class="seg"><button class="${mode==='mobile'?'active':''}" data-mode="mobile">手机界面</button><button class="${mode==='desktop'?'active':''}" data-mode="desktop">桌面适配</button></div></div><div class="tool-group"><span class="tool-caption">页面</span><select aria-label="选择预览页面" id="page-select">${Object.entries(pageNames).filter(([p])=>p!=='settings').map(([p,n])=>`<option value="${p}" ${page===p?'selected':''}>${n}</option>`).join('')}</select>${mode==='desktop'?`<div class="desktop-select">${Object.entries(variants).map(([v,m])=>`<button data-select-variant="${v}" class="${selected===v?'active':''}">${v.toUpperCase()} ${m.name}</button>`).join('')}</div>`:''}</div><div class="tool-group"><button class="text-tool" data-review-action="reset">重置演示</button><button class="text-tool" data-review-action="theme">${ico('moon')} 切换明暗</button></div></div><div class="designs ${mode==='desktop'?'desktop-board':''}">${Object.entries(variants).map(([v,m])=>`<section class="design-column ${v===selected?'is-active':''}" data-column="${v}"><div class="design-label"><div><h2><span>${v.toUpperCase()}</span>${m.name}</h2><p>${m.label}</p></div><button class="choose ${selected===v?'selected':''}" data-select-variant="${v}">${selected===v?'当前偏好':'偏好此款'}</button></div>${device(v)}<p class="design-note">${m.description}</p></section>`).join('')}</div><footer class="review-footer"><p>交互原型 · 示例日期 2026.10.11 · 可点击任务、闹钟、改期和换肤<br>原型不触发系统闹钟，不连接实际同步服务。</p><p>可直接选择 A / B / C，也可以组合喜欢的页面。<br>选定后再生成正式安卓 APP。</p></footer>`;
}
function openSheet(v,type,id){views[v].sheet={type,id};render();setTimeout(()=>document.querySelector(`[data-variant="${v}"] .sheet input`)?.focus({preventScroll:true}),30)}
document.addEventListener('click',e=>{
 const control=e.target.closest('button');if(!control)return;
 if(control.dataset.mode){mode=control.dataset.mode;render();return}
 if(control.dataset.selectVariant){selected=control.dataset.selectVariant;render();if(mode!=='desktop')toast(`当前偏好：${selected.toUpperCase()} ${variants[selected].name}。选定后可告诉我。`);return}
 if(control.dataset.reviewAction==='reset'){state=defaultState();save();Object.values(views).forEach(v=>v.sheet=null);render();toast('已恢复初始示例数据');return}
 if(control.dataset.reviewAction==='theme'){const next=state.skins[selected]==='dark'?'light':'dark';Object.keys(state.skins).forEach(k=>state.skins[k]=next);save();render();return}
 const el=control.closest('[data-variant]');if(!el)return;const v=el.dataset.variant,a=control.dataset.action,id=control.dataset.id;selected=v;
 if(pageNames[a]){views[v].page=a;views[v].sheet=null;render();return}
 if(a==='open-task'){views[v].taskId=id;views[v].page='task';render();return}
 if(a==='complete'){const t=taskById(id);t.done=!t.done;save();render();toast(t.done?`已完成「${t.title}」；该次任务的剩余提醒已停用`:'已恢复为未完成');return}
 if(a==='toggle-alarm'){const alarm=state.alarms.find(a=>a.id===id);alarm.enabled=!alarm.enabled;save();render();return}
 if(a==='toggle-shift'){state.shift.enabled=!state.shift.enabled;save();render();return}
 if(a==='skin'){state.skins[v]=control.dataset.skin;save();render();return}
 if(a==='close-sheet'){views[v].sheet=null;render();return}
 if(a==='postpone'){views[v].page='today';render();toast('保留当前截止日期，逾期等级继续按天加深');return}
 if(a==='remove-reminder'){const ev=state.events.find(e=>e.id===control.dataset.event);ev.reminders=ev.reminders.filter(r=>r.id!==id);save();render();toast('已删除该提醒');return}
 if(a==='calculate-due'){const form=control.closest('form'),start=form.elements.start.value,count=Number(form.elements.estimate.value);if(!start||count<1){toast('请先填写开始日期和预计天数');return}const d=new Date(start+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+count-1);form.elements.due.value=d.toISOString().slice(0,10);return}
 if(a==='add-reminder'){const t=taskById(views[v].taskId);const ev=state.events.find(x=>x.taskId===t.id);if(!ev){toast('请先为任务安排开始与结束时间');return}openSheet(v,a,ev.id);return}
 if(['reschedule','new-task','edit-event','new-alarm','edit-alarm','edit-shift','focus','alarm-info','connect'].includes(a)){openSheet(v,a,id);return}
});
document.addEventListener('change',e=>{
 const el=e.target;if(el.id==='page-select'){Object.values(views).forEach(v=>{v.page=el.value;v.sheet=null});render();return}
 if(el.dataset.device){state.devices.find(d=>d.id===el.dataset.device).mode=el.value;save();toast('已保存本机演示偏好；实际跨端同步尚未连接');return}
 if(el.hasAttribute('data-shift-anchor')){state.shift.anchor=el.value;save();render();return}
 if(el.hasAttribute('data-cycle-length')){const count=Math.min(14,Math.max(1,Number(el.value)||1));el.value=count;const form=el.closest('form'),container=form.querySelector('[data-cycle-fields]'),old=Array.from(container.querySelectorAll('input')).map(x=>x.value);container.innerHTML=Array.from({length:count},(_,i)=>`<label class="field"><span>第 ${i+1} 天</span><input name="day${i}" value="${esc(old[i]??'')}" placeholder="07:00, 12:30"></label>`).join('');return}
});
document.addEventListener('submit',e=>{
 const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();const v=form.closest('[data-variant]').dataset.variant,s=views[v].sheet,f=Object.fromEntries(new FormData(form));let message='已保存设置';
 try{
  if(s.type==='reschedule'){const index=state.tasks.findIndex(t=>t.id===s.id);state.tasks[index]=rescheduleTask(state.tasks[index],f.due);message=`已改期至 ${dateLabel(f.due)}，改期次数与标识色已更新`}
  if(s.type==='new-task'){if(!f.title.trim())throw Error('请填写待办名称');if(f.due<f.start)throw Error('截止日期不能早于开始日期');if(Boolean(f.eventStart)!==Boolean(f.eventEnd))throw Error('请同时填写开始和结束时间，或都留空');const id='task-'+Date.now();state.tasks.push({id,title:f.title.trim(),description:'从一小步开始。',type:f.type,start:f.start,due:f.due,estimate:Number(f.estimate),revision:0,done:false,history:[]});if(f.eventStart&&f.eventEnd)state.events.push({id:'event-'+Date.now(),taskId:id,start:f.eventStart,end:f.eventEnd,reminders:[]});message='已添加待办'+(f.type==='daily'?'（每日重复预览）':'')}
  if(s.type==='edit-event'){const ev=state.events.find(x=>x.id===s.id);ev.start=f.start;ev.end=f.end;message='时间已调整，相对提醒已随之更新';state.alarms.filter(a=>a.eventId===ev.id).forEach(a=>{const r=ev.reminders.find(r=>r.id===a.reminderId);if(r)a.time=offsetTime(r.anchor==='start'?ev.start:ev.end,r.offset).replace(/^(前一天 |次日 )/,'')})}
  if(s.type==='add-reminder'){const ev=state.events.find(x=>x.id===s.id);ev.reminders.push({id:'reminder-'+Date.now(),anchor:f.anchor,offset:Number(f.direction)*Number(f.minutes)});message='已添加相对提醒'}
  if(s.type==='new-alarm'||s.type==='edit-alarm'){const rule=f.kind==='once'?dateLabel(f.anchorDate)+'，仅一次':f.kind==='daily'?'每天':f.kind==='weekly'?'周一至周五':f.kind==='interval'?`从 ${dateLabel(f.anchorDate)}起，每隔 ${f.interval} 天`:f.kind==='window'?`${f.time}—${f.windowEnd}，每隔 ${f.interval} 分钟`:'关联事件提醒';const data={title:f.title.trim(),time:f.time,kind:f.kind,rule,interval:Number(f.interval),windowEnd:f.windowEnd,anchorDate:f.anchorDate,snooze:Number(f.snooze),maxSnoozes:Number(f.maxSnoozes),tone:f.tone,duration:Number(f.duration),vibrate:f.vibrate==='yes'};if(s.id)Object.assign(state.alarms.find(a=>a.id===s.id),data);else state.alarms.unshift({id:'alarm-'+Date.now(),...data,enabled:true});message='已保存闹钟规则（原型不触发实际响铃）'}
  if(s.type==='edit-shift'){const days=Array.from({length:Number(f.length)},(_,i)=>{const times=f['day'+i].split(/[,，]/).map(x=>x.trim()).filter(Boolean);if(times.some(t=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(t)))throw Error('时间请使用 24 小时格式，例如 07:00');return{label:times.length?'上班':'休息',times}});if(f.scope==='date'){const offset=Math.floor((Date.parse(f.exceptionDate+'T00:00:00Z')-Date.parse(state.shift.anchor+'T00:00:00Z'))/86400000);if(offset<0)throw Error('例外日期不能早于排班起点');const idx=offset%days.length;state.shift.exceptions={...state.shift.exceptions,[f.exceptionDate]:days[idx].times};message='已保存当天例外，后续循环位置保持不变'}else{state.shift.days=days;message='已更新循环排班'}}
  save();views[v].sheet=null;render();toast(message);
 }catch(error){form.querySelector('.sheet-error').textContent=error.message}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){Object.values(views).forEach(v=>v.sheet=null);render()}});
render();
</script></body></html>
